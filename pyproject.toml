[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conda-pypi-repodata-patches"
version = "0.1.0"
description = "Generates changes to the index metadata for the conda-pypi channel."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
  { name = "conda-forge" },
]
dependencies = [
  "annotated-types",
  "packaging",
  "pydantic",
  "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["conda_pypi_repodata_patches"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
conda-pypi-repodata-patches = { path = ".", editable = true }

[tool.pixi.dependencies]
msgpack-python = "*"
pytest = "*"

[tool.pixi.tasks]
validate = 'python -c "from conda_pypi_repodata_patches.blocks import load_blocks; from conda_pypi_repodata_patches.patches import load_patches; b = load_blocks(); assert {x.name for x in b} == {\"lerc\", \"tk\"}, b; load_patches()"'
show-diff = "python show_diff.py"
generate = "python -m conda_pypi_repodata_patches.generate"
schema = "python -m conda_pypi_repodata_patches.patch_yaml_model"
test = "pytest -v"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
"backports.zstd" = "*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
"backports.zstd" = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
"backports.zstd" = "*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
"backports.zstd" = "*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["py314"]
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]
