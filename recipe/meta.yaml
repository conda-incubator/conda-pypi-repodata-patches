{% set pyproject = load_file_data("../pyproject.toml", from_recipe_dir=True) %}
{% set py_project = pyproject["project"] %}
{% set py_version = py_project["version"] if py_project is mapping else "0.0.0" %}

package:
  name: conda-pypi-repodata-patches
  version: {{ environ.get("VERSION_OVERRIDE", py_version + ".dev0") }}

source:
  # Use the working tree so local builds include uncommitted blocks.
  # CI builds from a clean checkout, so the difference does not matter there.
  path: ..

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - annotated-types
    - backports.zstd
    - msgpack-python
    - packaging
    - pydantic
    - pyyaml

test:
  imports:
    - conda_pypi_repodata_patches
    - conda_pypi_repodata_patches.blocks
    - conda_pypi_repodata_patches.patches
    - conda_pypi_repodata_patches.generate
    - conda_pypi_repodata_patches.shards
  commands:
    - python -c "from conda_pypi_repodata_patches.blocks import load_blocks; from conda_pypi_repodata_patches.patches import load_patches; b = load_blocks(); assert {x.name for x in b} == {'lerc', 'tk'}, b; load_patches()"

about:
  home: https://github.com/conda-incubator/conda-pypi-repodata-patches
  description: |
    Generates delta_patch_instructions.json for the conda-pypi channel from
    declarative block and patch definitions.
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Generates changes to the index metadata for the conda-pypi channel

extra:
  recipe-maintainers:
    - danyeaw
